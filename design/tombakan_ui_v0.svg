<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" font-family="'Baloo 2','Fredoka','Mali','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a6b8a"/>
      <stop offset="0.55" stop-color="#0e87a8"/>
      <stop offset="1" stop-color="#0a4f6b"/>
    </linearGradient>
    <linearGradient id="seaDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c7 a0"/>
      <stop offset="0" stop-color="#0c7aa0"/>
      <stop offset="1" stop-color="#073a52"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb24d"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9743f"/>
      <stop offset="1" stop-color="#9c5a2c"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe17a"/>
      <stop offset="1" stop-color="#f6b800"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1440" height="980" fill="#10212b"/>
  <text x="60" y="56" fill="#fff" font-size="30" font-weight="700">Tombakan — UI/UX redesign direction (v0)</text>
  <text x="60" y="84" fill="#9fc4d2" font-size="17">Kids' AR colour-learning · big touch targets · colour + word + icon · playful ocean theme</text>

  <!-- ============ PHONE 1: MAIN MENU ============ -->
  <g transform="translate(70,120)">
    <rect width="380" height="760" rx="46" fill="url(#sea)" filter="url(#soft)"/>
    <rect x="14" y="14" width="352" height="732" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- light rays -->
    <polygon points="120,14 180,14 120,360 60,360" fill="#ffffff" opacity="0.06"/>
    <polygon points="250,14 300,14 290,360 200,360" fill="#ffffff" opacity="0.05"/>
    <!-- top bar -->
    <circle cx="332" cy="56" r="22" fill="#ffffff" fill-opacity="0.16"/>
    <text x="332" y="63" text-anchor="middle" font-size="20">🔊</text>
    <!-- logo -->
    <text x="190" y="150" text-anchor="middle" fill="#fff" font-size="54" font-weight="800" letter-spacing="2">TOMBAKAN</text>
    <rect x="120" y="166" width="140" height="8" rx="4" fill="url(#cta)"/>
    <text x="190" y="196" text-anchor="middle" fill="#cdeaf2" font-size="16">Tangkap ikan, belajar warna!</text>
    <!-- mascot fish -->
    <g transform="translate(190,330)">
      <ellipse cx="0" cy="0" rx="86" ry="58" fill="#ff7a59"/>
      <polygon points="78,0 140,-42 140,42" fill="#ff7a59"/>
      <circle cx="-34" cy="-12" r="13" fill="#fff"/>
      <circle cx="-30" cy="-10" r="6" fill="#15303a"/>
      <path d="M-44,22 Q-10,44 30,24" stroke="#15303a" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- best score badge -->
    <g transform="translate(95,452)">
      <rect width="190" height="52" rx="26" fill="#ffffff" fill-opacity="0.14"/>
      <text x="22" y="33" font-size="22">🏆</text>
      <text x="56" y="26" fill="#bfe2ec" font-size="12">REKOR</text>
      <text x="56" y="44" fill="#fff" font-size="20" font-weight="700">1.700</text>
    </g>
    <!-- PLAY -->
    <g transform="translate(60,540)" filter="url(#softer)">
      <rect width="260" height="84" rx="42" fill="url(#cta)"/>
      <text x="130" y="56" text-anchor="middle" fill="#5a2a00" font-size="34" font-weight="800">▶  MAIN</text>
    </g>
    <!-- secondary -->
    <g transform="translate(60,648)">
      <rect width="124" height="56" rx="28" fill="#ffffff" fill-opacity="0.14"/>
      <text x="62" y="37" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">Cara Main</text>
      <rect x="136" y="0" width="124" height="56" rx="28" fill="#ffffff" fill-opacity="0.14"/>
      <text x="198" y="37" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">Warna</text>
    </g>
    <text x="190" y="730" text-anchor="middle" fill="#7fb0c0" font-size="12">MENU UTAMA</text>
  </g>

  <!-- ============ PHONE 2: GAMEPLAY HUD ============ -->
  <g transform="translate(530,120)">
    <rect width="380" height="760" rx="46" fill="url(#seaDeep)" filter="url(#soft)"/>
    <rect x="14" y="14" width="352" height="732" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- AR camera hint -->
    <text x="190" y="40" text-anchor="middle" fill="#bfe2ec" font-size="12" opacity="0.8">● REC  AR</text>

    <!-- score chip -->
    <g transform="translate(34,58)">
      <rect width="150" height="56" rx="28" fill="#0b2733" fill-opacity="0.6"/>
      <text x="22" y="26" fill="#9fc4d2" font-size="12">SKOR</text>
      <text x="22" y="46" fill="#fff" font-size="24" font-weight="800">900</text>
    </g>
    <!-- mute -->
    <circle cx="332" cy="86" r="24" fill="#0b2733" fill-opacity="0.6"/>
    <text x="332" y="93" text-anchor="middle" font-size="20">🔊</text>

    <!-- timer bar -->
    <g transform="translate(34,128)">
      <rect width="312" height="16" rx="8" fill="#0b2733" fill-opacity="0.7"/>
      <rect width="206" height="16" rx="8" fill="#39d98a"/>
      <text x="312" y="13" text-anchor="end" fill="#fff" font-size="13" font-weight="700">0:24</text>
    </g>

    <!-- TARGET CARD (colour + word + icon) -->
    <g transform="translate(60,176)" filter="url(#softer)">
      <rect width="260" height="92" rx="22" fill="#ffffff"/>
      <text x="20" y="32" fill="#5a7682" font-size="13" font-weight="600">TANGKAP IKAN</text>
      <rect x="20" y="42" width="40" height="40" rx="10" fill="#e23b3b"/>
      <text x="74" y="74" fill="#15303a" font-size="34" font-weight="800">MERAH</text>
      <text x="228" y="40" font-size="22">🎯</text>
    </g>

    <!-- water + fish -->
    <g opacity="0.95">
      <ellipse cx="120" cy="430" rx="60" ry="40" fill="#39d98a"/>
      <polygon points="172,430 210,406 210,454" fill="#39d98a"/>
      <ellipse cx="270" cy="500" rx="52" ry="34" fill="#e23b3b"/>
      <polygon points="316,500 348,480 348,520" fill="#e23b3b"/>
      <ellipse cx="160" cy="560" rx="46" ry="30" fill="#3d7bff"/>
      <polygon points="200,560 228,544 228,576" fill="#3d7bff"/>
      <ellipse cx="118" cy="428" rx="9" ry="9" fill="#fff"/><circle cx="121" cy="430" r="4" fill="#15303a"/>
    </g>

    <!-- combo feedback -->
    <g transform="translate(95,330)">
      <rect width="190" height="46" rx="23" fill="url(#goldBadge)" filter="url(#softer)"/>
      <text x="95" y="30" text-anchor="middle" fill="#7a4a00" font-size="20" font-weight="800">+200  COMBO ×2</text>
    </g>

    <!-- throw button + aim -->
    <circle cx="190" cy="648" r="46" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="6 8"/>
    <g transform="translate(140,688)" filter="url(#softer)">
      <rect width="100" height="64" rx="32" fill="url(#cta)"/>
      <text x="50" y="42" text-anchor="middle" fill="#5a2a00" font-size="18" font-weight="800">LEMPAR</text>
    </g>
    <text x="190" y="730" text-anchor="middle" fill="#7fb0c0" font-size="12">SAAT BERMAIN</text>
  </g>

  <!-- ============ PHONE 3: RESULT ============ -->
  <g transform="translate(990,120)">
    <rect width="380" height="760" rx="46" fill="url(#sea)" filter="url(#soft)"/>
    <rect x="14" y="14" width="352" height="732" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

    <text x="190" y="70" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">SELESAI!</text>

    <!-- new record badge -->
    <g transform="translate(120,84)">
      <rect width="140" height="34" rx="17" fill="url(#goldBadge)"/>
      <text x="70" y="23" text-anchor="middle" fill="#7a4a00" font-size="15" font-weight="800">★ REKOR BARU</text>
    </g>

    <!-- stars / tier -->
    <g transform="translate(0,150)" font-size="46" text-anchor="middle">
      <text x="110" y="0" fill="#f6b800">★</text>
      <text x="190" y="-10" fill="#ffd84d">★</text>
      <text x="270" y="0" fill="#f6b800">★</text>
    </g>

    <!-- score -->
    <text x="190" y="248" text-anchor="middle" fill="#cdeaf2" font-size="14">SKOR AKHIR</text>
    <text x="190" y="304" text-anchor="middle" fill="#fff" font-size="62" font-weight="800">1.700</text>

    <!-- accuracy + best -->
    <g transform="translate(60,332)">
      <rect width="120" height="64" rx="18" fill="#ffffff" fill-opacity="0.14"/>
      <text x="60" y="28" text-anchor="middle" fill="#bfe2ec" font-size="12">AKURASI</text>
      <text x="60" y="52" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">75%</text>
      <rect x="140" y="0" width="120" height="64" rx="18" fill="#ffffff" fill-opacity="0.14"/>
      <text x="200" y="28" text-anchor="middle" fill="#bfe2ec" font-size="12">REKOR</text>
      <text x="200" y="52" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1.700</text>
    </g>

    <!-- colours caught -->
    <text x="60" y="440" fill="#cdeaf2" font-size="13" font-weight="600">IKAN DITANGKAP</text>
    <g transform="translate(60,452)" font-size="15" font-weight="700">
      <rect width="92" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="12" y="11" width="18" height="18" rx="5" fill="#e23b3b"/>
      <text x="58" y="26" text-anchor="middle" fill="#fff">Merah×3</text>
      <rect x="104" y="0" width="84" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="116" y="11" width="18" height="18" rx="5" fill="#3d7bff"/>
      <text x="158" y="26" text-anchor="middle" fill="#fff">Biru×1</text>
      <rect x="200" y="0" width="92" height="40" rx="20" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="212" y="11" width="18" height="18" rx="5" fill="#39d98a"/>
      <text x="256" y="26" text-anchor="middle" fill="#fff">Hijau×2</text>
    </g>

    <!-- buttons -->
    <g transform="translate(60,560)" filter="url(#softer)">
      <rect width="260" height="76" rx="38" fill="url(#cta)"/>
      <text x="130" y="50" text-anchor="middle" fill="#5a2a00" font-size="26" font-weight="800">↻  MAIN LAGI</text>
    </g>
    <g transform="translate(60,652)">
      <rect width="260" height="60" rx="30" fill="#ffffff" fill-opacity="0.14"/>
      <text x="130" y="39" text-anchor="middle" fill="#fff" font-size="19" font-weight="600">🏠  Beranda</text>
    </g>
    <text x="190" y="734" text-anchor="middle" fill="#7fb0c0" font-size="12">HASIL</text>
  </g>

  <!-- ===== design tokens strip ===== -->
  <g transform="translate(70,902)">
    <text x="0" y="0" fill="#9fc4d2" font-size="14" font-weight="700">PALET</text>
    <g transform="translate(70,-14)">
      <rect width="26" height="26" rx="6" fill="#0e87a8"/><rect x="34" width="26" height="26" rx="6" fill="#ff8a3d"/>
      <rect x="68" width="26" height="26" rx="6" fill="#f6b800"/><rect x="102" width="26" height="26" rx="6" fill="#39d98a"/>
      <rect x="136" width="26" height="26" rx="6" fill="#e23b3b"/><rect x="170" width="26" height="26" rx="6" fill="#3d7bff"/>
      <rect x="204" width="26" height="26" rx="6" fill="#ffffff"/>
    </g>
    <text x="360" y="0" fill="#9fc4d2" font-size="14" font-weight="700">PRINSIP</text>
    <text x="360" y="20" fill="#cdeaf2" font-size="13">Tombol ≥64px · teks minim · warna+kata+ikon · kontras tinggi · umpan balik cepat</text>
  </g>
</svg>
