name: CI

on:
  push:
    branches: [master, main, "iteration/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # C# lint via dotnet-format. Runs independently of the Unity license so it
  # always gives quick feedback on formatting. Unity project files (.csproj)
  # are generated by the Unity Editor on first import; if they don't exist yet
  # (fresh clone, no Library/) the step skips gracefully instead of failing.
  # continue-on-error keeps this from blocking Unity jobs.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format || true

      - name: Find .csproj files
        id: find-csproj
        run: |
          files=$(find . -name "*.csproj" -not -path "*/Library/*" | head -5)
          if [ -z "$files" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .csproj found — Unity hasn't generated project files yet, skipping lint"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found project files:"
            echo "$files"
            # Store newline-separated list as space-separated for the next step
            echo "files=$(echo "$files" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Run dotnet-format
        if: steps.find-csproj.outputs.found == 'true'
        run: |
          for f in ${{ steps.find-csproj.outputs.files }}; do
            echo "Checking $f …"
            dotnet format "$f" --verify-no-changes || true
          done

  # ---------------------------------------------------------------------------
  # Detect whether the Unity license secret is configured. The Unity jobs below
  # need it to activate the editor; without it they SKIP (not fail) so the PR
  # status stays meaningful instead of perma-red on a missing secret.
  # ---------------------------------------------------------------------------
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
            echo "Unity license secret found — Unity jobs will run."
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE secret not set — Unity test/build jobs will be skipped. Add it in Settings > Secrets and variables > Actions."
          fi

  # ---------------------------------------------------------------------------
  # EditMode unit tests (game-ci). Compiles the whole project (a real build
  # check) and runs the NUnit suite in Tombakan.Tests.
  # ---------------------------------------------------------------------------
  test:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts

  # ---------------------------------------------------------------------------
  # Android build verification (game-ci). Runs only after tests pass.
  # ---------------------------------------------------------------------------
  build-android:
    needs: [check-secrets, test]
    if: needs.check-secrets.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          targetPlatform: Android

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: build
