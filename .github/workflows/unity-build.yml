name: Unity Build

# Runs after tests pass on master. Builds the Android APK and uploads it
# as an artifact so you can download and install it for device E2E testing.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Run tests first ──────────────────────────────────────────────────
  test:
    name: Run ${{ matrix.testMode }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - name: Run Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:   .
          unityVersion:  2022.3.62f1
          testMode:      ${{ matrix.testMode }}
          artifactsPath: TestResults/${{ matrix.testMode }}
          githubToken:   ${{ secrets.GITHUB_TOKEN }}
          checkName:     "${{ matrix.testMode }} Test Results"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults-${{ matrix.testMode }}
          path: TestResults/${{ matrix.testMode }}

  # ── Build Android APK (only after both test jobs pass) ───────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:       .
          unityVersion:      2022.3.62f1
          targetPlatform:    Android
          buildName:         Tombakan
          androidExportType: androidPackage
          versioning:        Semantic

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tombakan-Android-APK
          path: build/Android/
          retention-days: 14
